name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r tools/requirements.txt
      - name: Validate (strict)
        run: python tools/validate/validate.py --strict
      - name: Test exercises
        run: tools/check-exercises.sh
      - name: Export quizzes
        run: python tools/export/quiz.py -o build/quizzes
      - name: Build slide PDFs
        run: |
          mkdir -p build/slides
          find courses -name slides.md | sort | while read -r f; do
            grep -q '^marp: true' "$f" || continue
            lesson=$(dirname "$f")
            name=$(echo "${lesson#courses/}" | tr '/' '_')
            npx --yes @marp-team/marp-cli@4.1.2 "$f" --pdf --allow-local-files -o "build/slides/$name.pdf"
          done
      - name: Package
        run: |
          cd build
          zip -qr "../quizzes-$GITHUB_REF_NAME.zip" quizzes
          if [ -n "$(ls slides)" ]; then zip -qr "../slides-$GITHUB_REF_NAME.zip" slides; fi
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ./*.zip
